strong { font-weight: 600; }
.table { overflow-x: auto; margin: 0 0 16px; }
table { border-collapse: collapse; width: 100%; background: var(--surface); font-size: 15px; }
th, td { text-align: left; vertical-align: top; padding: 10px 12px; border: 1.5px solid var(--line); }

footer .wrap { padding-top: 20px; padding-bottom: 32px; display: flex; flex-wrap: wrap; gap: 8px 24px; }
